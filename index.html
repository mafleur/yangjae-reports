KS), TIGER 미국배당다우존스 (458730.KS), Alibaba (BABA), MP Materials (MP))는 이번 점검에서 판정 자체가 불가능했습니다. USA Rare Earth (USAR)의 무효화 2단계 경고선 15.76달러를 일봉 종가로 이탈하면 잔여 비중 축소 대상이 되며, 이 판단은 다시 봅니다.", "kind": "watch", "symbol": null, "name": null, "published_at": "2026-09-15T15:40:54+09:00", "url": "r/holdings-KR-20260915/"}, {"slug": "report2-20260915", "title": "수익률 극대화 검증 리포트 · 2026-09-15", "summary": "수익률을 극대화할 방법을 찾기 전에 극대화할 엣지가 있는지를 먼저 확인했고, 답은 없다는 쪽입니다. 2018~2026년을 2년 학습 / 1년 검증으로 굴려 학습 구간에서 청산 규칙과 노출 한도를 고르고 다음 구간에서만 채점하니, 무작위 종목 추첨 3벌의 6.7년 누적 수익률이 -0.6% / +79.7% / -17.9%로 부호조차 갈립니다. 학습 구간 MAR 1.36~2.92가 검증 구간에서 -0.11~1.03으로 무너지고(격차 1.23~2.40), 2022년 검증 구간은 세 추첨 전부 -17.2% ~ -20.0%로 계좌 낙폭 한도 20%를 넘깁니다. 이 결과로는 집행 정책을 바꾸지 않으며, 판정은 롱 온리 구조 엔진이 하락 국면에서 무엇을 해야 하는지가 정해질 때까지 보류합니다. 되돌릴 조건은 하나입니다 — 무작위 추첨 3벌 전부에서 검증 구간 기대값이 양수이고 2022년 같은 하락 구간의 낙폭이 20% 안에 들어올 때.", "kind": "report", "symbol": null, "name": "수익률 극대화 검증", "published_at": "2026-09-15T12:49:19+09:00", "url": "r/report2-20260915/"}, {"slug": "market-20260915-kr-20260915", "title": "시황 리포트 · 2026-09-15", "summary": "FOMC를 하루 앞두고 금리 인상 확률이 92% 넘게 가격에 들어왔고, S&P 500은 9월 14일 정규장을 7,620으로 마쳐 경고 해제 조건 두 개(종가 7,668 회복 · 30년 국채 금리 5.286% 아래)가 모두 미충족입니다 — 신규 위험자산 편입 중단(경고 단계)을 그대로 유지하며, S&P 500이 정규장 종가로 7,580 아래에서 마치면 보유분 축소 검토로 올리고, 7,668 위에서 마치면서 동시에 30년 금리가 5.286% 아래로 내려오면 해제합니다. 코스피·나스닥 사다리 1차 가격에는 둘 다 닿았으나 FOMC 결과 확인 전에는 집행하지 않는다는 직전 조건을 그대로 둡니다.", "kind": "market", "symbol": null, "name": null, "published_at": "2026-09-15T12:06:14+09:00", "url": "r/market-20260915-kr-20260915/"}, {"slug": "report-20260915", "title": "구조 엔진 백테스트 리포트 · 2026-09-15", "summary": "현 집행 정책(고정 목표 전량 청산)은 선택편향이 없는 무작위 9종목에서 매매당 -0.048R로 기대값이 음수이며, 전체 24종목에서 나온 +0.075R은 보유·관심 목록 쪽(+0.139R)이 끌어올린 값입니다. 게다가 이 +0.075R은 슬리피지를 30bp로 올리거나, 미체결 만료를 20일로 늘리거나, 신호 주기를 3일로 줄이면 세 경우 모두 음수로 뒤집힙니다. 이 결과로는 현 정책에 실전 자금을 늘릴 수 없고, 판정은 다음 두 가지가 모두 확인될 때까지 보류합니다 — ① 구간을 3년 이상으로 늘려 2022년 약세장을 포함시켰을 때도 무작위 유니버스에서 기대값이 양수인지 ② 그때도 상위 3건을 제거한 뒤 양수로 남는지. 청산을 고정 목표에서 ATR 트레일링으로 바
