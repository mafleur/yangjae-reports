<style>
:root{--bg:#fbfbfa;--panel:#fff;--fg:#1c1c1a;--muted:#6b6b66;--line:#e3e3df;

*{box-sizing:border-box}

.card time{color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
footer{color:var(--muted);font-size:12px;margin-top:44px;padding-top:14px;
border-top:1px solid var(--line)}
</style>

티는 국면이므로 신규 롱은 75,363원 일봉 종가 회복 확인 뒤에만 검토하시고, 72,450원을 일봉 종가로 내준 뒤 3거래일 내 회복하지 못하고 반등이 그 가격에서 막히면 매수 논리를 폐기하십시오(집행 손절은 회복 매수 71,309원 / 지지 확인 매수 69,254원으로 별도 작동합니다).", "kind": "ticker", "symbol": "034020.KS", "name": "Doosan Enerbility", "published_at": "2026-08-24T23:36:51+09:00", "url": "r/doosan-enerbility-034020-ks-20260824/"}, {"slug": "ls-electric-010120-ks-20260824", "title": "LS ELECTRIC (010120.KS) 종목 리포트 · 2026-08-24", "summary": "평단 233,000원 대비 -20.47%(현재가 185,300원)이나 지금 자리는 주가가 갇힌 박스의 아래쪽(167,367원)에서 1.18 ATR밖에 안 남은 지점이라 즉시 전량 손절은 권하지 않으며, 일봉 종가가 165,400원(7/30 반등 신호가 나온 저점) 또는 167,367원(박스 아래쪽)을 깨면 그때 전량 손절하고, 그 전에는 194,700 / 201,551 / 213,844원 반등 구간에서 나눠 줄이는 것이 실행 계획입니다.", "kind": "ticker", "symbol": "010120.KS", "name": "LS ELECTRIC", "published_at": "2026-08-24T09:39:10+09:00", "url": "r/ls-electric-010120-ks-20260824/"}, {"slug": "invesco-qqq-trust-series-1-qqq-20260824", "title": "Invesco QQQ Trust, Series 1 (QQQ) 종목 리포트 · 2026-08-24", "summary": "QQQ는 682.94~729.84 박스에 갇힌 중립 구간에 있어 현재가 713.44에서의 신규 매수는 근거가 없으며, 701.70까지 눌릴 때 사거나(손익비 1:3.5) 729.46을 일봉 종가로 넘는 것을 확인한 뒤 따라 붙는 것이 유일한 매수 전략입니다.", "kind": "ticker", "symbol": "QQQ", "name": "Invesco QQQ Trust, Series 1", "published_at": "2026-08-24T08:33:01+09:00", "url": "r/invesco-qqq-trust-series-1-qqq-20260824/"}, {"slug": "sk-hynix-000660-ks-20260822", "title": "SK hynix (000660.KS) 종목 리포트 · 2026-08-22", "summary": "SK하이닉스는 하락·중립 국면이며 유일하게 산출된 셋업(reclaim_long)의 손익비가 0.93으로 1 미만이라 신규 진입 보류·관망이 타당하고, 1,820,709원 종가 회복을 확인한 뒤에야 롱 전환을 검토합니다.", "kind": "ticker", "symbol": "000660.KS", "name": "SK hynix", "published_at": "2026-08-22T14:06:51+09:00", "url": "r/sk-hynix-000660-ks-20260822/"}, {"slug": "setup-check", "title": "발행 파이프라인 점검", "summary": "발행 경로(PDF 생성 → 웹 페이지 → GitHub push → Telegram)가 정상 동작하는지 확인하기 위한 점검용 문서이며, 투자 판단 내용은 포함하지 않습니다.", "kind": "report", "symbol": null, "published_at": "2026-08-22T13:51:48+09:00", "url": "r/setup-check/"}];
const list=document.getElementById('list');
const q=document.getElementById('q');
let kind='all';
const LBL={"ticker": "종목", "market": "시황", "macro": "매크로", "report": "리포트"};
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function subject(r){return r.name&&r.symbol?`${r.name} (${r.symbol})`:(r.name||r.symbol||'')}
function render(){
  const t=q.value.trim().toLowerCase();
  const rows=DATA.filter(r=>(kind==='all'||r.kind===kind)&&(!t||
    [r.title,r.summary,r.symbol,r.name,r.kind].filter(Boolean).join(' ').toLowerCase().includes(t)));
  list.innerHTML=rows.length?rows.map(r=>{
    const d=(r.published_at||'').slice(0,16).replace('T',' ');
    return `<a class="card" href="${esc(r.url)}">
      <div class="row"><span class="badge">${esc(LBL[r.kind]||r.kind)}</span>
      ${subject(r)?`<strong>${esc(subject(r))}</strong>`:''}<time>${esc(d)}</time></div>
      <h2>${esc(r.title)}</h2>
      ${r.summary?`<p class="sum">${esc(r.summary)}</p>`:''}</a>`}).join('')
    :'<p class="empty">조건에 맞는 리포트가 없습니다.</p>';
}
q.addEventListener('input',render);
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  kind=c.dataset.kind;
  document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));
  render();
}));
render();
</script></div></body></html>
